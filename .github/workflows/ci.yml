name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # One job per Go module. This repo is a workspace (see go.work): `go test
    # ./...` from the root covers the root module ONLY and silently skips
    # email, otel, sms and websocket entirely. Running them separately is the
    # whole point of this matrix.
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'email', 'otel', 'sms', 'websocket']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # -short skips the tests that need Docker; -race is why this workflow
      # earns its keep, since several of the bugs it guards were data races.
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -short -race -timeout 5m ./...

  # Everything above tests the framework's own packages. This tests the thing
  # users actually receive: the CLI binary, the project it generates, and
  # whether that project compiles. Nothing did this until v0.7.0, and six
  # defects shipped through the gap -- see issues #25 through #28.
  scaffold:
    name: scaffold and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build the CLI
        run: go build -o "$RUNNER_TEMP/tjo" ./cmd/tjo

      - name: Generate a project
        working-directory: ${{ runner.temp }}
        run: ./tjo new demo -d sqlite

      # Point the generated project at this checkout. Without it the job
      # resolves the published framework and validates the wrong code -- and
      # the submodules need the same treatment, because between `make release`
      # bumping the pins and the tags being pushed those versions do not exist
      # yet.
      - name: Build against this checkout, not the published release
        working-directory: ${{ runner.temp }}/demo
        run: |
          go mod edit -replace github.com/jimmitjoo/tjo=$GITHUB_WORKSPACE
          for m in email otel sms websocket; do
            go mod edit -replace github.com/jimmitjoo/tjo/$m=$GITHUB_WORKSPACE/$m
          done
          go mod tidy

      - name: Build the generated project
        working-directory: ${{ runner.temp }}/demo
        run: |
          go build ./...
          go vet ./...

      - name: Add authentication
        working-directory: ${{ runner.temp }}/demo
        run: $RUNNER_TEMP/tjo make auth

      - name: Build it again with auth
        working-directory: ${{ runner.temp }}/demo
        run: |
          go mod tidy
          go build ./...
          go vet ./...
          go test ./...
