name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New advisories land against unchanged code, so a PR-only gate never sees
  # them. The vuln job below is the reason this schedule exists.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # One job per Go module. This repo is a workspace (see go.work): `go test
    # ./...` from the root covers the root module ONLY and silently skips
    # email, otel, sms and websocket entirely. Running them separately is the
    # whole point of this matrix.
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'email', 'llm', 'otel', 'sms', 'websocket']

    # Cheap enough to run for every module in the matrix rather than splitting
    # the job in two; only the root module reads the DSN.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tjo
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: tjotest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tjo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # -short skips the tests that need Docker; -race is why this workflow
      # earns its keep, since several of the bugs it guards were data races.
      #
      # TJO_TEST_POSTGRES_DSN turns on database/postgres_integration_test.go,
      # which skips without it. Before v0.8.0 every test in that package ran on
      # SQLite or mocks, so the pgx v4 -> v5 driver swap in #37 had no coverage
      # that would have noticed PostgreSQL breaking outright. The service
      # container below is only defined for the root module; the others skip.
      - name: Test
        working-directory: ${{ matrix.module }}
        env:
          TJO_TEST_POSTGRES_DSN: ${{ matrix.module == '.' && 'postgres://tjo:secret@localhost:5432/tjotest?sslmode=disable' || '' }}
        run: go test -short -race -timeout 5m ./...

  # Scorecard rates the repository against automated supply-chain checks and
  # publishes the result. Several of them -- Signed-Releases, Pinned-Dependencies,
  # Token-Permissions, Vulnerabilities, Security-Policy -- are things v0.8.0 and
  # v0.9.0 already do, so this reports work already done rather than adding any.
  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'

    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  # The release workflow is not exercised by anything else here, so a syntax
  # error in it merges green and only shows up when a release is attempted.
  # That is what happened to v0.9.0: a multi-line string in the release notes
  # had lines starting at column 0, which ends the YAML block scalar. GitHub
  # could not parse the file, showed the workflow named after its path, and
  # refused to dispatch it -- reporting, accurately but confusingly, that it has
  # no workflow_dispatch trigger.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

  # Go 1.27 makes encoding/json/v2 the implementation behind encoding/json.
  # It deliberately keeps v1's semantics, so this is a canary rather than a
  # migration: measured before it was written, the v1 API under jsonv2 still
  # accepts duplicate object names and still substitutes replacement characters
  # for invalid UTF-8, exactly as it does today. If that ever stops being true
  # this job goes red before a Go release makes it everyone's problem.
  jsonv2:
    name: jsonv2 canary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test under GOEXPERIMENT=jsonv2
        env:
          GOEXPERIMENT: jsonv2
        run: go test -short -timeout 10m ./...

  # v0.7.0 shipped with 71 vulnerabilities that had a call path from this
  # repository's own code -- an unpatchable SQL injection among them -- and CI
  # was green the whole time, because nothing ran govulncheck. The findings were
  # the symptom; this missing job was the defect.
  #
  # Matrixed over the same six modules for the same reason the test job is:
  # `govulncheck ./...` from the root reaches the root module only.
  #
  # govulncheck exits 3 when a vulnerable symbol is reachable and 0 when clean,
  # so failing the build is the default behaviour. Do not add continue-on-error.
  #
  # Pinned by version rather than run through a third-party action: `go run` on a
  # pinned module path is verified by the checksum database, which is one fewer
  # supply chain dependency for the job whose whole purpose is supply chain.
  vuln:
    name: vuln ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'email', 'llm', 'otel', 'sms', 'websocket']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  # Everything above tests the framework's own packages. This tests the thing
  # users actually receive: the CLI binary, the project it generates, and
  # whether that project compiles. Nothing did this until v0.7.0, and six
  # defects shipped through the gap -- see issues #25 through #28.
  scaffold:
    name: scaffold ${{ matrix.template }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        template: [default, blog, saas, api]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The generated go.mod must point at this checkout before the CLI is
      # built, because the template is embedded at build time and `tjo new`
      # runs `go mod tidy` itself as its last step. Adding the replace
      # afterwards is too late: tidy has already tried to resolve a released
      # version, which during a release window does not exist yet.
      #
      # Without this the job would validate the published framework rather
      # than the branch under test, which is the wrong thing entirely.
      - name: Point the scaffold template at this checkout
        run: |
          {
            echo ""
            echo "replace github.com/jimmitjoo/tjo => $GITHUB_WORKSPACE"
            for m in email llm otel sms websocket; do
              echo "replace github.com/jimmitjoo/tjo/$m => $GITHUB_WORKSPACE/$m"
            done
          } >> cmd/tjo/templates/go.mod.txt

      - name: Build the CLI
        run: go build -o "$RUNNER_TEMP/tjo" ./cmd/tjo

      - name: Generate a project
        working-directory: ${{ runner.temp }}
        run: ./tjo new demo -t ${{ matrix.template }} -d sqlite

      - name: Build the generated project
        working-directory: ${{ runner.temp }}/demo
        run: |
          go build ./...
          go vet ./...

      # auth, a resource controller and a plain handler all land in package
      # handlers alongside whatever the starter template put there. Generating
      # them together is the combination that actually breaks -- a helper
      # defined in one and called from another compiles alone and not together.
      - name: Add authentication and generated code
        working-directory: ${{ runner.temp }}/demo
        run: |
          "$RUNNER_TEMP/tjo" make auth
          "$RUNNER_TEMP/tjo" make controller Widget
          "$RUNNER_TEMP/tjo" make handler Thing

      - name: Build it again with everything generated
        working-directory: ${{ runner.temp }}/demo
        run: |
          go mod tidy
          go build ./...
          go vet ./...
          go test ./...
